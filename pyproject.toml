[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cat-controller"
version = "0.1.0"
description = "FastAPI-ready controller and K1 integration assets for an AI cat"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Mars680-star" }
]
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1"
]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1"
]

[tool.setuptools.packages.find]
where = ["src"]
